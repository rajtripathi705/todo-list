<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Todo List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <div class="brand">Todo List</div>
      <div class="nav-actions">
        <span id="todo-count" aria-live="polite">0</span>
      </div>
    </div>
  </nav>

  <main class="app">
    <h1>Todo List</h1>
    <div class="input-row">
      <input id="todo-input" placeholder="Add a new task" autofocus />
      <button id="add-btn">Add</button>
    </div>
    <ul id="todo-list"></ul>
    <p class="hint">Tasks are stored in localStorage — refresh preserves them.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
